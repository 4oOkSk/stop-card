name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android 17 platform
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :testbed:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            testbed/build/outputs/apk/*/debug/*.apk
